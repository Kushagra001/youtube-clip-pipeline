name: YouTube Clipping Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"   # Runs automatically every 6 hours
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run (or 'all' for parallel run across all 10 channels)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - acc_01_cats
          - acc_02_dogs
          - acc_03_fitness
          - acc_04_motivation
          - acc_05_finance
          - acc_06_business
          - acc_07_food
          - acc_08_ai_tools
          - acc_09_grooming
          - acc_10_mental_health

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-pipeline
  cancel-in-progress: false

jobs:
  setup:
    name: Configure Target Matrix
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.set-matrix.outputs.channels }}
    steps:
      - id: set-matrix
        run: |
          INPUT_CH="${{ github.event.inputs.channel }}"
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ] || [ -z "$INPUT_CH" ] || [ "$INPUT_CH" = "all" ]; then
            CHANNELS_JSON='["acc_01_cats","acc_02_dogs","acc_03_fitness","acc_04_motivation","acc_05_finance","acc_06_business","acc_07_food","acc_08_ai_tools","acc_09_grooming","acc_10_mental_health"]'
          else
            CHANNELS_JSON="[\"$INPUT_CH\"]"
          fi
          echo "Target channels: $CHANNELS_JSON"
          echo "channels=$CHANNELS_JSON" >> $GITHUB_OUTPUT

  clip:
    needs: setup
    name: "Pipeline: ${{ matrix.channel }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.setup.outputs.channels) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Deno for YouTube Challenge Solving
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies & Genuine Fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            echo "apt-get attempt $attempt..."
            if sudo -E apt-get update -qq -o Acquire::Retries=3 && \
               sudo -E apt-get install -y -o Acquire::Retries=3 --no-install-recommends ffmpeg fontconfig fonts-dejavu fonts-liberation fonts-noto-core fonts-deva fonts-noto-color-emoji; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get failed after 3 attempts" >&2
              exit 100
            fi
            sleep 5
          done
          fc-cache -fv || true
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp

      - name: Start Proof-of-Origin Token Provider
        run: |
          docker run --name bgutil-provider -d --network host --restart always brainicism/bgutil-ytdlp-pot-provider || true
          sleep 4
          docker ps
          curl -s http://127.0.0.1:4416/ping || echo "Warning: ping returned non-zero"

      - name: Stagger Network Setup
        run: sleep $((RANDOM % 25 + 1))

      - name: Set up Cloudflare WARP (IP Masking)
        timeout-minutes: 1
        continue-on-error: true
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: v4
          mode: wireguard

      - name: Verify & Guard WARP Tunnel
        timeout-minutes: 4
        continue-on-error: true
        run: |
          check_warp_trace() {
            local tr
            tr=$(timeout 6 curl -fsS -4 --max-time 5 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            if echo "$tr" | grep -q "warp=on"; then
              printf '%s\n' "$tr"
              return 0
            fi
            return 1
          }

          record_warp_env() {
            local path_label ip_val
            path_label=$(printf '%s' "$1" | tr -d '\r\n')
            ip_val=$(printf '%s' "${2:-unknown}" | tr -d '\r\n')
            [ -n "$ip_val" ] || ip_val="unknown"
            if [ -n "${GITHUB_ENV:-}" ]; then
              printf 'WARP_EGRESS_PATH=%s\n' "$path_label" >> "$GITHUB_ENV"
              printf 'WARP_EGRESS_IP=%s\n' "$ip_val" >> "$GITHUB_ENV"
            fi
          }

          check_yt_player() {
            local probe_dir="/tmp/yt_probe_$$"
            rm -rf "$probe_dir"
            mkdir -p "$probe_dir"
            local out_sub out_pl vtt_file hint hint2
            # 1) Verify real timedtext subtitle + player extraction on client chain 1
            out_sub=$(timeout 24 yt-dlp --skip-download --ignore-no-formats-error \
              --write-subs --write-auto-subs --sub-langs "en-orig,en" --sub-format vtt \
              --socket-timeout 10 --retries 1 \
              --extractor-args "youtube:player_client=visionos,ios,mweb" \
              --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
              -o "$probe_dir/%(id)s.%(ext)s" \
              "https://www.youtube.com/watch?v=M7lc1UVf-VE" 2>&1 || true)
            vtt_file=$(find "$probe_dir" -maxdepth 1 -name "M7lc1UVf-VE*.vtt" -size +1000c 2>/dev/null | head -n 1 || true)
            if [ -z "$vtt_file" ] || echo "$out_sub" | grep -qiE "HTTP Error 429|Too Many Requests"; then
              hint=$(printf '%s\n' "$out_sub" | grep -iE "ERROR:|WARNING:|Sign in|429|timed out" | tail -n 1 || true)
              echo "  [yt-probe] Probe 1 (M7lc1UVf-VE) failed${hint:+: ${hint:0:140}}" >&2
              rm -rf "$probe_dir"
              return 1
            fi
            # 2) Verify full player/format extraction on a second distinct video (prevents single-request false pass)
            out_pl=$(timeout 18 yt-dlp --no-download \
              --socket-timeout 10 --retries 1 \
              --extractor-args "youtube:player_client=android_vr,mweb,web" \
              --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
              -s --print "%(id)s" "https://www.youtube.com/watch?v=Ks-_Mh1QhMc" 2>&1 || true)
            rm -rf "$probe_dir"
            if echo "$out_pl" | grep -q "^Ks-_Mh1QhMc$"; then
              return 0
            fi
            hint2=$(printf '%s\n' "$out_pl" | grep -iE "ERROR:|WARNING:|Sign in|429|timed out" | tail -n 1 || true)
            echo "  [yt-probe] Probe 2 (Ks-_Mh1QhMc) failed${hint2:+: ${hint2:0:140}}" >&2
            return 1
          }

          teardown_wireguard_warp() {
            sudo wg-quick down warp 2>/dev/null || true
            sudo resolvconf -d warp 2>/dev/null || true
            sudo ip link delete dev warp 2>/dev/null || true
            sudo ip -4 rule del not fwmark 51820 table 51820 2>/dev/null || true
            sudo ip -4 rule del table main suppress_prefixlength 0 2>/dev/null || true
            sudo ip -6 rule del not fwmark 51820 table 51820 2>/dev/null || true
            sudo ip -6 rule del table main suppress_prefixlength 0 2>/dev/null || true
          }

          BAD_V4_IPS=" "
          add_bad_ip() {
            local ip="$1"
            [ -n "$ip" ] || return 0
            case "$BAD_V4_IPS" in
              *" $ip "*) ;;
              *) BAD_V4_IPS="${BAD_V4_IPS}${ip} " ;;
            esac
          }
          is_bad_ip() {
            local ip="$1"
            [ -n "$ip" ] || return 1
            case "$BAD_V4_IPS" in
              *" $ip "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          apply_warp_ipv6_gai() {
            [ -f /etc/gai.conf ] && sudo cp /etc/gai.conf /etc/gai.conf.bak 2>/dev/null || true
            sudo tee /etc/gai.conf >/dev/null <<'EOF'
          label ::1/128       0
          label ::/0          1
          label fc00::/7      1
          label 2002::/16     2
          label ::/96         3
          label ::ffff:0:0/96 4
          precedence ::1/128       50
          precedence ::/0          40
          precedence fc00::/7      40
          precedence 2002::/16     30
          precedence ::/96         20
          precedence ::ffff:0:0/96 10
          EOF
            docker cp /etc/gai.conf bgutil-provider:/etc/gai.conf 2>/dev/null || true
            docker restart bgutil-provider >/dev/null 2>&1 || true
            for _ in 1 2 3 4 5 6 7 8; do
              if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
          }

          restore_default_gai() {
            if [ -f /etc/gai.conf.bak ]; then
              sudo mv /etc/gai.conf.bak /etc/gai.conf
            else
              sudo rm -f /etc/gai.conf
            fi
            docker cp /etc/gai.conf bgutil-provider:/etc/gai.conf 2>/dev/null || docker exec bgutil-provider rm -f /etc/gai.conf 2>/dev/null || true
            docker restart bgutil-provider >/dev/null 2>&1 || true
            for _ in 1 2 3 4 5 6; do
              if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
          }

          echo "Verifying Cloudflare WARP tunnel and YouTube player health..."
          WORKING_EP=""
          INIT_TRACE=$(check_warp_trace || true)
          if [ -n "$INIT_TRACE" ]; then
            echo "$INIT_TRACE" | head -n 8
            INIT_IP=$(echo "$INIT_TRACE" | sed -n 's/^ip=//p' | head -n 1)
            WORKING_EP=$(sudo wg show warp endpoints 2>/dev/null | awk '{print $2; exit}' || true)
            if check_yt_player; then
              echo "Cloudflare WARP tunnel + YouTube player verified healthy!"
              record_warp_env "WARP IPv4 (initial)" "$INIT_IP"
              exit 0
            fi
            add_bad_ip "$INIT_IP"
            echo "::notice::WARP tunnel up (ip=$INIT_IP) but YouTube player/subtitle probe failed; rotating WARP endpoint/exit..."
          else
            echo "::notice::Initial WARP endpoint unresponsive; trying alternate WireGuard endpoints..."
          fi

          # Stage A: Try alternate Cloudflare WARP UDP/2408 WireGuard endpoints
          if ip link show warp >/dev/null 2>&1 || sudo test -f /etc/wireguard/warp.conf; then
            if ! ip link show warp >/dev/null 2>&1 && sudo test -f /etc/wireguard/warp.conf; then
              sudo wg-quick up warp 2>/dev/null || true
            fi
            PEER_KEY=$(sudo wg show warp peers 2>/dev/null | head -n 1 || true)
            if [ -z "$PEER_KEY" ] && sudo test -f /etc/wireguard/warp.conf; then
              PEER_KEY=$(sudo grep -i '^PublicKey' /etc/wireguard/warp.conf 2>/dev/null | head -n 1 | sed -E 's/^PublicKey[[:space:]]*=[[:space:]]*//I' | tr -d ' \r' || true)
            fi
            if [ -n "$PEER_KEY" ]; then
              SAME_IP_HITS=0
              for ep in \
                "162.159.193.1:2408" \
                "188.114.96.1:2408" \
                "162.159.195.1:2408" \
                "162.159.192.2:2408" \
                "188.114.97.1:2408" \
                "162.159.198.1:2408"
              do
                echo "Trying WARP WireGuard endpoint $ep..."
                sudo wg set warp peer "$PEER_KEY" endpoint "$ep" persistent-keepalive 15 2>/dev/null || continue
                sleep 1
                NEW_TRACE=$(check_warp_trace || true)
                if [ -z "$NEW_TRACE" ]; then
                  echo "Endpoint $ep unresponsive; skipping..."
                  continue
                fi
                WORKING_EP="$ep"
                NEW_IP=$(echo "$NEW_TRACE" | sed -n 's/^ip=//p' | head -n 1)
                if is_bad_ip "$NEW_IP"; then
                  SAME_IP_HITS=$((SAME_IP_HITS + 1))
                  echo "Endpoint $ep still maps to flagged egress ip=$NEW_IP ($SAME_IP_HITS/2)..."
                  if [ "$SAME_IP_HITS" -ge 2 ]; then
                    echo "Stopping WireGuard endpoint scan early and switching to unique WARP IPv6 / warp-cli..."
                    break
                  fi
                  continue
                fi
                if check_yt_player; then
                  echo "$NEW_TRACE" | head -n 8
                  echo "Cloudflare WARP recovered via alternate WireGuard endpoint ($ep, ip=$NEW_IP)!"
                  record_warp_env "Stage A WireGuard ($ep)" "$NEW_IP"
                  exit 0
                fi
                echo "Endpoint $ep -> ip=$NEW_IP (YouTube probe failed)"
                add_bad_ip "$NEW_IP"
              done
            fi
          fi

          # Stage B (fast): Test unique per-runner WARP IPv6 (2a09:bac...) via /etc/gai.conf
          if ip link show warp >/dev/null 2>&1 || sudo test -f /etc/wireguard/warp.conf; then
            echo "Testing unique per-runner WARP IPv6 egress via /etc/gai.conf..."
            if ! ip link show warp >/dev/null 2>&1 && sudo test -f /etc/wireguard/warp.conf; then
              sudo wg-quick up warp 2>/dev/null || true
            fi
            # Restore known-good endpoint if Stage A finished on an unresponsive endpoint
            if [ -n "$WORKING_EP" ]; then
              PEER_KEY=$(sudo wg show warp peers 2>/dev/null | head -n 1 || true)
              if [ -n "$PEER_KEY" ]; then
                sudo wg set warp peer "$PEER_KEY" endpoint "$WORKING_EP" persistent-keepalive 15 2>/dev/null || true
                sleep 1
              fi
            elif sudo test -f /etc/wireguard/warp.conf; then
              sudo wg-quick down warp 2>/dev/null || true
              sudo wg-quick up warp 2>/dev/null || true
              sleep 1
            fi
            V6_TRACE=$(timeout 6 curl -fsS -6 --max-time 5 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            if echo "$V6_TRACE" | grep -q "warp=on"; then
              apply_warp_ipv6_gai
              PREF_TRACE=$(timeout 6 curl -fsS --max-time 5 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
              PY_AF=$(python3 -c 'import socket; print(socket.getaddrinfo("www.youtube.com", 443, 0, socket.SOCK_STREAM)[0][0].name)' 2>/dev/null || true)
              if echo "$PREF_TRACE" | grep -q "warp=on" && echo "$PREF_TRACE" | grep -qE "^ip=.*:"; then
                PREF_V6=$(echo "$PREF_TRACE" | sed -n 's/^ip=//p' | head -n 1)
                echo "Default dual-stack egress now routed via WARP IPv6 ($PREF_V6 | Python AF=${PY_AF:-unknown})"
                if check_yt_player; then
                  echo "$PREF_TRACE" | head -n 8
                  echo "Cloudflare WARP recovered via unique WARP IPv6 egress ($PREF_V6)!"
                  record_warp_env "Stage B WARP IPv6" "$PREF_V6"
                  exit 0
                fi
                echo "WARP IPv6 ($PREF_V6) YouTube probe failed; restoring default /etc/gai.conf..."
              else
                echo "Default dual-stack trace did not prefer IPv6 (Python AF=${PY_AF:-unknown}); restoring default /etc/gai.conf..."
              fi
              restore_default_gai
            else
              echo "WireGuard WARP IPv6 trace unavailable; escalating to warp-cli..."
            fi
          fi

          # Stage C: Official cloudflare-warp client (fresh device registration + MASQUE / WireGuard)
          echo "Trying official cloudflare-warp (MASQUE / WireGuard) with fresh registration..."
          teardown_wireguard_warp

          if timeout 90 bash -c '
            curl -fsSL --max-time 15 https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg && \
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null && \
            sudo apt-get update -qq && \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cloudflare-warp
          '; then
            sudo systemctl start warp-svc 2>/dev/null || true
            for _ in 1 2 3 4 5; do
              if sudo warp-cli --accept-tos status >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            sudo warp-cli --accept-tos registration delete 2>/dev/null || true
            sudo warp-cli --accept-tos registration new 2>/dev/null || true
            sudo warp-cli --accept-tos mode warp 2>/dev/null || true
            sudo warp-cli --accept-tos tunnel protocol set MASQUE 2>/dev/null || true
            sudo warp-cli --accept-tos connect 2>/dev/null || true
            for i in 1 2 3 4 5 6; do
              sleep 3
              MASQUE_TRACE=$(check_warp_trace || true)
              if [ -n "$MASQUE_TRACE" ]; then
                MASQUE_IP=$(echo "$MASQUE_TRACE" | sed -n 's/^ip=//p' | head -n 1)
                if is_bad_ip "$MASQUE_IP"; then
                  echo "warp-cli MASQUE exited via same flagged ip=$MASQUE_IP"
                elif check_yt_player; then
                  echo "$MASQUE_TRACE" | head -n 8
                  echo "Cloudflare WARP recovered via official warp-cli (MASQUE, ip=$MASQUE_IP)!"
                  record_warp_env "Stage C warp-cli MASQUE" "$MASQUE_IP"
                  exit 0
                else
                  echo "warp-cli MASQUE -> ip=$MASQUE_IP (YouTube probe failed)"
                  add_bad_ip "$MASQUE_IP"
                fi
                # Try warp-cli MASQUE IPv6 as well if available
                M_V6=$(timeout 6 curl -fsS -6 --max-time 5 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
                if echo "$M_V6" | grep -q "warp=on"; then
                  apply_warp_ipv6_gai
                  M_PREF=$(timeout 6 curl -fsS --max-time 5 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
                  if echo "$M_PREF" | grep -q "warp=on" && echo "$M_PREF" | grep -qE "^ip=.*:" && check_yt_player; then
                    M_V6_IP=$(echo "$M_PREF" | sed -n 's/^ip=//p' | head -n 1)
                    echo "$M_PREF" | head -n 8
                    echo "Cloudflare WARP recovered via official warp-cli (MASQUE IPv6, ip=$M_V6_IP)!"
                    record_warp_env "Stage C warp-cli MASQUE IPv6" "$M_V6_IP"
                    exit 0
                  fi
                  restore_default_gai
                fi
                break
              fi
            done
            echo "warp-cli MASQUE did not clear YouTube probe; trying warp-cli WireGuard..."
            sudo warp-cli --accept-tos disconnect 2>/dev/null || true
            sudo warp-cli --accept-tos tunnel protocol set WireGuard 2>/dev/null || true
            sudo warp-cli --accept-tos connect 2>/dev/null || true
            for i in 1 2 3 4; do
              sleep 3
              WGCLI_TRACE=$(check_warp_trace || true)
              if [ -n "$WGCLI_TRACE" ]; then
                WGCLI_IP=$(echo "$WGCLI_TRACE" | sed -n 's/^ip=//p' | head -n 1)
                if is_bad_ip "$WGCLI_IP"; then
                  echo "warp-cli WireGuard also exited via flagged ip=$WGCLI_IP"
                  break
                fi
                if check_yt_player; then
                  echo "$WGCLI_TRACE" | head -n 8
                  echo "Cloudflare WARP recovered via official warp-cli (WireGuard, ip=$WGCLI_IP)!"
                  record_warp_env "Stage C warp-cli WireGuard" "$WGCLI_IP"
                  exit 0
                fi
                echo "warp-cli WireGuard -> ip=$WGCLI_IP (YouTube probe failed)"
                add_bad_ip "$WGCLI_IP"
                break
              fi
            done
            sudo warp-cli --accept-tos disconnect 2>/dev/null || true
            sudo systemctl stop warp-svc 2>/dev/null || true
            sudo ip link delete dev CloudflareWARP 2>/dev/null || true
          fi

          # Restore WireGuard WARP interface so traffic stays masked rather than dropping to raw Azure
          if sudo test -f /etc/wireguard/warp.conf && ! ip link show warp >/dev/null 2>&1; then
            sudo wg-quick up warp 2>/dev/null || true
          fi
          FINAL_V4=$(check_warp_trace || true)
          if [ -n "$FINAL_V4" ]; then
            FINAL_IP=$(echo "$FINAL_V4" | sed -n 's/^ip=//p' | head -n 1)
            echo "::warning::YouTube player check still failing across WARP IPv4/IPv6 paths; keeping WARP interface active rather than falling back to raw Azure."
            echo "$FINAL_V4" | head -n 8
            record_warp_env "WARP IPv4 (probe failed, kept)" "$FINAL_IP"
          else
            echo "::warning::Cloudflare WARP tunnel unhealthy or unresponsive after fallbacks; tearing down warp interface cleanly."
            teardown_wireguard_warp
            echo "Fallback direct egress trace:"
            DIRECT_TRACE=$(curl -s --max-time 8 https://www.cloudflare.com/cdn-cgi/trace || true)
            DIRECT_IP=$(echo "$DIRECT_TRACE" | sed -n 's/^ip=//p' | head -n 1)
            echo "$DIRECT_TRACE" | head -n 8 || true
            record_warp_env "Direct Azure (WARP down)" "$DIRECT_IP"
          fi

      - name: Configure YouTube Authentication Cookies
        env:
          YOUTUBE_COOKIES_RAW: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          mkdir -p output
          if [ -n "$YOUTUBE_COOKIES_RAW" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES_RAW" > output/cookies.txt
            echo "Installed YouTube session cookies ($(wc -l < output/cookies.txt) lines, $(wc -c < output/cookies.txt) bytes)"
          else
            echo "Notice: YOUTUBE_COOKIES secret not set or empty"
          fi

      - name: Run Autonomous Pipeline for ${{ matrix.channel }}
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_P2: ${{ secrets.YOUTUBE_CLIENT_ID_P2 }}
          YOUTUBE_CLIENT_SECRET_P2: ${{ secrets.YOUTUBE_CLIENT_SECRET_P2 }}
          YOUTUBE_CLIENT_ID_P3: ${{ secrets.YOUTUBE_CLIENT_ID_P3 }}
          YOUTUBE_CLIENT_SECRET_P3: ${{ secrets.YOUTUBE_CLIENT_SECRET_P3 }}
          YOUTUBE_REFRESH_TOKEN_ACC_01: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_01 }}
          YOUTUBE_REFRESH_TOKEN_ACC_02: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_02 }}
          YOUTUBE_REFRESH_TOKEN_ACC_03: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_03 }}
          YOUTUBE_REFRESH_TOKEN_ACC_04: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_04 }}
          YOUTUBE_REFRESH_TOKEN_ACC_05: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_05 }}
          YOUTUBE_REFRESH_TOKEN_ACC_06: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_06 }}
          YOUTUBE_REFRESH_TOKEN_ACC_07: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_07 }}
          YOUTUBE_REFRESH_TOKEN_ACC_08: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_08 }}
          YOUTUBE_REFRESH_TOKEN_ACC_09: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_09 }}
          YOUTUBE_REFRESH_TOKEN_ACC_10: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_10 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python main.py --channel "${{ matrix.channel }}"

      - name: Proof-of-Origin Provider Logs
        if: always()
        run: |
          docker logs bgutil-provider || true

      - name: Archive Generated Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            output/clips/
            output/exports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean Temporary Video Cache
        if: always()
        run: rm -rf output/downloads/*

      - name: Publish Job Summary & Status
        if: always()
        run: |
          if [ -f scripts/write_job_summary.py ]; then
            python3 scripts/write_job_summary.py --channel "${{ matrix.channel }}" --job-status "${{ job.status }}"
          else
            echo "::error::Job failed during Checkout before pipeline scripts were available (status=${{ job.status }})."
          fi

      - name: Upload Job Status Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.channel }}-${{ github.run_id }}
          path: output/run_summary_${{ matrix.channel }}.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit & Push Channel State with Rebase Retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed_${{ matrix.channel }}.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): update ${{ matrix.channel }} state [skip ci]"
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Push attempt $attempt..."
              git rebase --abort 2>/dev/null || true
              if git pull --rebase -X theirs origin main && git push origin main; then
                echo "State successfully synced for ${{ matrix.channel }}!"
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 8 + 2))
            done
          else
            echo "No state changes to commit for ${{ matrix.channel }}."
          fi

  notify_failure:
    name: Consolidated Failure Summary
    needs: [setup, clip]
    if: always() && (needs.setup.result == 'failure' || needs.clip.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Channel Status Reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: status-*-${{ github.run_id }}
          path: status_reports
          merge-multiple: true

      - name: Publish Consolidated Summary & Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXPECTED_CHANNELS_JSON: ${{ needs.setup.outputs.channels }}
        run: |
          python scripts/send_failure_summary.py \
            --reports-dir status_reports \
            --setup-result "${{ needs.setup.result }}" \
            --clip-result "${{ needs.clip.result }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
