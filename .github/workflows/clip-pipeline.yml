name: YouTube Clipping Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"   # Runs automatically every 6 hours
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run (or 'all' for parallel run across all 10 channels)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - acc_01_cats
          - acc_02_dogs
          - acc_03_fitness
          - acc_04_motivation
          - acc_05_finance
          - acc_06_business
          - acc_07_food
          - acc_08_ai_tools
          - acc_09_grooming
          - acc_10_mental_health

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-pipeline
  cancel-in-progress: false

jobs:
  setup:
    name: Configure Target Matrix
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.set-matrix.outputs.channels }}
    steps:
      - id: set-matrix
        run: |
          INPUT_CH="${{ github.event.inputs.channel }}"
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ] || [ -z "$INPUT_CH" ] || [ "$INPUT_CH" = "all" ]; then
            CHANNELS_JSON='["acc_01_cats","acc_02_dogs","acc_03_fitness","acc_04_motivation","acc_05_finance","acc_06_business","acc_07_food","acc_08_ai_tools","acc_09_grooming","acc_10_mental_health"]'
          else
            CHANNELS_JSON="[\"$INPUT_CH\"]"
          fi
          echo "Target channels: $CHANNELS_JSON"
          echo "channels=$CHANNELS_JSON" >> $GITHUB_OUTPUT

  clip:
    needs: setup
    name: "Pipeline: ${{ matrix.channel }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.setup.outputs.channels) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Deno for YouTube Challenge Solving
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies & Genuine Fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            echo "apt-get attempt $attempt..."
            if sudo -E apt-get update -qq -o Acquire::Retries=3 && \
               sudo -E apt-get install -y -o Acquire::Retries=3 --no-install-recommends ffmpeg fontconfig fonts-dejavu fonts-liberation fonts-noto-core fonts-deva fonts-noto-color-emoji; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get failed after 3 attempts" >&2
              exit 100
            fi
            sleep 5
          done
          fc-cache -fv || true
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp

      - name: Start Proof-of-Origin Token Provider
        run: |
          docker run --name bgutil-provider -d --network host --restart always brainicism/bgutil-ytdlp-pot-provider || true
          sleep 4
          docker ps
          curl -s http://127.0.0.1:4416/ping || echo "Warning: ping returned non-zero"

      - name: Stagger Network Setup
        run: sleep $((RANDOM % 25 + 1))

      - name: Set up Cloudflare WARP (IP Masking)
        timeout-minutes: 1
        continue-on-error: true
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: v4
          mode: wireguard

      - name: Verify & Guard WARP Tunnel
        timeout-minutes: 3
        continue-on-error: true
        run: |
          check_warp_health() {
            local tr
            tr=$(timeout 9 curl -fsS --max-time 6 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            if echo "$tr" | grep -q "warp=on" && timeout 9 curl -fsS --max-time 6 https://www.youtube.com/robots.txt >/dev/null 2>&1; then
              echo "$tr" | head -n 8
              return 0
            fi
            return 1
          }

          teardown_wireguard_warp() {
            sudo wg-quick down warp 2>/dev/null || true
            sudo resolvconf -d warp 2>/dev/null || true
            sudo ip link delete dev warp 2>/dev/null || true
            sudo ip -4 rule del not fwmark 51820 table 51820 2>/dev/null || true
            sudo ip -4 rule del table main suppress_prefixlength 0 2>/dev/null || true
            sudo ip -6 rule del not fwmark 51820 table 51820 2>/dev/null || true
            sudo ip -6 rule del table main suppress_prefixlength 0 2>/dev/null || true
          }

          echo "Verifying Cloudflare WARP tunnel health..."
          if check_warp_health; then
            echo "Cloudflare WARP tunnel active and healthy!"
            exit 0
          fi

          echo "::notice::Initial WARP endpoint unresponsive; trying alternate WireGuard endpoints..."
          if ip link show warp >/dev/null 2>&1 || [ -f /etc/wireguard/warp.conf ]; then
            if ! ip link show warp >/dev/null 2>&1 && [ -f /etc/wireguard/warp.conf ]; then
              sudo wg-quick up warp 2>/dev/null || true
            fi
            PEER_KEY=$(sudo wg show warp peers 2>/dev/null | head -n 1 || true)
            if [ -z "$PEER_KEY" ] && [ -f /etc/wireguard/warp.conf ]; then
              PEER_KEY=$(grep -i '^PublicKey' /etc/wireguard/warp.conf | head -n 1 | sed -E 's/^PublicKey[[:space:]]*=[[:space:]]*//I' | tr -d ' \r' || true)
            fi
            if [ -n "$PEER_KEY" ]; then
              for ep in \
                "162.159.192.1:500" \
                "162.159.192.2:4500" \
                "162.159.193.1:2408" \
                "162.159.193.10:1701" \
                "162.159.195.1:2408" \
                "188.114.96.1:2408" \
                "188.114.97.1:500" \
                "188.114.98.1:4500"
              do
                echo "Trying WARP WireGuard endpoint $ep..."
                sudo wg set warp peer "$PEER_KEY" endpoint "$ep" persistent-keepalive 15 2>/dev/null || continue
                sleep 1
                if check_warp_health; then
                  echo "Cloudflare WARP recovered via alternate WireGuard endpoint ($ep)!"
                  exit 0
                fi
              done
            fi
          fi

          echo "Alternate WireGuard endpoints unresponsive; tearing down WireGuard 'warp' and trying official warp-cli (MASQUE)..."
          teardown_wireguard_warp

          if timeout 90 bash -c '
            curl -fsSL --max-time 15 https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg && \
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null && \
            sudo apt-get update -qq && \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cloudflare-warp
          '; then
            sudo systemctl start warp-svc 2>/dev/null || true
            sleep 2
            sudo warp-cli --accept-tos registration new 2>/dev/null || true
            sudo warp-cli --accept-tos mode warp 2>/dev/null || true
            sudo warp-cli --accept-tos tunnel protocol set MASQUE 2>/dev/null || true
            sudo warp-cli --accept-tos connect 2>/dev/null || true
            for i in 1 2 3 4 5 6; do
              sleep 3
              if check_warp_health; then
                echo "Cloudflare WARP recovered via official warp-cli (MASQUE)!"
                exit 0
              fi
            done
            echo "warp-cli MASQUE check failed; trying warp-cli WireGuard..."
            sudo warp-cli --accept-tos disconnect 2>/dev/null || true
            sudo warp-cli --accept-tos tunnel protocol set WireGuard 2>/dev/null || true
            sudo warp-cli --accept-tos connect 2>/dev/null || true
            for i in 1 2 3 4; do
              sleep 3
              if check_warp_health; then
                echo "Cloudflare WARP recovered via official warp-cli (WireGuard)!"
                exit 0
              fi
            done
            sudo warp-cli --accept-tos disconnect 2>/dev/null || true
            sudo systemctl stop warp-svc 2>/dev/null || true
          fi

          echo "::warning::Cloudflare WARP tunnel unhealthy or unresponsive after fallbacks; tearing down warp interface cleanly."
          teardown_wireguard_warp
          echo "Fallback direct egress trace:"
          curl -s --max-time 8 https://www.cloudflare.com/cdn-cgi/trace | head -n 8 || true

      - name: Configure YouTube Authentication Cookies
        env:
          YOUTUBE_COOKIES_RAW: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          mkdir -p output
          if [ -n "$YOUTUBE_COOKIES_RAW" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES_RAW" > output/cookies.txt
            echo "Installed YouTube session cookies ($(wc -l < output/cookies.txt) lines, $(wc -c < output/cookies.txt) bytes)"
          else
            echo "Notice: YOUTUBE_COOKIES secret not set or empty"
          fi

      - name: Run Autonomous Pipeline for ${{ matrix.channel }}
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_P2: ${{ secrets.YOUTUBE_CLIENT_ID_P2 }}
          YOUTUBE_CLIENT_SECRET_P2: ${{ secrets.YOUTUBE_CLIENT_SECRET_P2 }}
          YOUTUBE_CLIENT_ID_P3: ${{ secrets.YOUTUBE_CLIENT_ID_P3 }}
          YOUTUBE_CLIENT_SECRET_P3: ${{ secrets.YOUTUBE_CLIENT_SECRET_P3 }}
          YOUTUBE_REFRESH_TOKEN_ACC_01: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_01 }}
          YOUTUBE_REFRESH_TOKEN_ACC_02: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_02 }}
          YOUTUBE_REFRESH_TOKEN_ACC_03: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_03 }}
          YOUTUBE_REFRESH_TOKEN_ACC_04: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_04 }}
          YOUTUBE_REFRESH_TOKEN_ACC_05: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_05 }}
          YOUTUBE_REFRESH_TOKEN_ACC_06: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_06 }}
          YOUTUBE_REFRESH_TOKEN_ACC_07: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_07 }}
          YOUTUBE_REFRESH_TOKEN_ACC_08: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_08 }}
          YOUTUBE_REFRESH_TOKEN_ACC_09: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_09 }}
          YOUTUBE_REFRESH_TOKEN_ACC_10: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC_10 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python main.py --channel "${{ matrix.channel }}"

      - name: Proof-of-Origin Provider Logs
        if: always()
        run: |
          docker logs bgutil-provider || true

      - name: Archive Generated Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            output/clips/
            output/exports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean Temporary Video Cache
        if: always()
        run: rm -rf output/downloads/*

      - name: Commit & Push Channel State with Rebase Retry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed_${{ matrix.channel }}.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): update ${{ matrix.channel }} state [skip ci]"
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Push attempt $attempt..."
              git rebase --abort 2>/dev/null || true
              if git pull --rebase -X theirs origin main && git push origin main; then
                echo "State successfully synced for ${{ matrix.channel }}!"
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 8 + 2))
            done
          else
            echo "No state changes to commit for ${{ matrix.channel }}."
          fi
