  enabled: true
  channel_name: "CALM YOUR MIND"
  handle: "@calmyourmind"
  tagline: "RESET YOUR NERVOUS SYSTEM & FIND PEACE 🧘"
  icon: "🧘"
  outro_seconds: 1.8

