channel_id: "acc_10_mental_health"

discovery:
  enabled: true
  niches:
    - "anxiety relief nervous system reset"
    - "adhd focus dopamine hacks neuroscience"
    - "deep sleep hygiene calm racing thoughts"
    - "overcoming burnout emotional regulation"
    - "vagus nerve stimulation calm panic"
  creators:
    - "@HealthyGamerGG"
    - "@hubermanlab"
    - "@TherapyinaNutshell"
    - "@TheDiaryOfACEO"
    - "@TheHolisticPsychologist"
    - "@MelRobbins"
